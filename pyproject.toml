[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ece455-proton-magnetometer"
version = "0.2.0"
description = "Simulation, breadboard, and consistency utilities for one proton magnetometer design"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]
bench = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
include = ["util*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["util/tests"]
pythonpath = ["."]
