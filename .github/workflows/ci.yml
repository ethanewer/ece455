name: verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Tests (design consistency, simulation, breadboard, firmware estimator)
        run: make test
      - name: Regenerate simulation and breadboard documents
        run: make docs
