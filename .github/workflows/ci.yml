name: verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run Python checks
        run: make test
      - name: Test portable estimator
        run: make firmware CC=gcc
      - name: Validate receiver netlist
        run: python receiver_design/verify.py
